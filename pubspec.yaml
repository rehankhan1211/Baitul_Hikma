name: baitul_hikma
description: "Baitul Hikma — House of Wisdom. A premium knowledge and reading experience."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Navigation
  go_router: ^14.6.2

  # UI / Fonts
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # Dependency Injection
  get_it: ^8.0.2

  # Local Storage
  shared_preferences: ^2.3.3

  # Audio
  just_audio: ^0.9.42

  # Utils
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  device_preview: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icons/Baitul Hikmag app icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icons/Baitul Hikmag app icon.png"
  windows:
    generate: true
    image_path: "assets/icons/Baitul Hikmag app icon.png"

flutter:
  uses-material-design: true

  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700

  assets:
    - assets/images/
    - assets/icons/
    - assets/data/
